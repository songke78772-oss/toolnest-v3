<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Room - ToolNest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
  <!-- Header -->
  <div class="bg-white shadow px-4 py-3 flex justify-between items-center">
    <div>
      <span class="font-semibold text-lg" id="myName">...</span>
      <span class="text-sm text-gray-500 ml-2" id="countdown">--:--:--</span>
    </div>
    <button id="dissolveBtn" class="hidden text-sm text-red-600 hover:underline">
      Dissolve Room
    </button>
  </div>

  <!-- Messages -->
  <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

  <!-- Input -->
  <div class="bg-white border-t p-3">
    <form id="msgForm" class="flex gap-2">
      <input id="msgInput" type="text" class="flex-1 border rounded px-3 py-2" placeholder="Type a message..." autocomplete="off">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Send
      </button>
    </form>
  </div>

  <script>
    const socket = io({ path: '/chat/socket.io' });
    const params = new URLSearchParams(window.location.search);
    const roomId = window.location.pathname.split('/')[3];
    const isCreator = params.get('creator') === '1';
    const creatorName = params.get('name') || '';

    let myName = '';
    let expireAt = 0;
    let password = null;

    // Simple client-side encryption (optional deep encryption)
    async function encrypt(text) {
      if (!password) return text;
      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        encoder.encode(password.padEnd(16, '0')),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: encoder.encode('burnchat'), iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt']
      );
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
      const combined = new Uint8Array(iv.length + encrypted.byteLength);
      combined.set(iv);
      combined.set(new Uint8Array(encrypted), iv.length);
      return btoa(String.fromCharCode(...combined));
    }

    async function decrypt(ciphertext) {
      if (!password || !ciphertext || ciphertext === ciphertext) return ciphertext;
      try {
        const combined = Uint8Array.from(atob(ciphertext), c => c.charCodeAt(0));
        const iv = combined.slice(0, 12);
        const data = combined.slice(12);
        const encoder = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          'raw',
          encoder.encode(password.padEnd(16, '0')),
          { name: 'PBKDF2' },
          false,
          ['deriveKey']
        );
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: encoder.encode('burnchat'), iterations: 100000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        return new TextDecoder().decode(decrypted);
      } catch (e) {
        return '[Encrypted]';
      }
    }

    function updateCountdown() {
      if (!expireAt) return;
      const left = Math.max(0, expireAt - Date.now());
      const h = Math.floor(left / 3600000);
      const m = Math.floor((left % 3600000) / 60000);
      const s = Math.floor((left % 60000) / 1000);
      document.getElementById('countdown').textContent =
        `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }
    setInterval(updateCountdown, 1000);

    function addMessage(name, text, isSystem = false) {
      const div = document.createElement('div');
      div.className = isSystem
        ? 'text-center text-sm text-gray-500'
        : 'bg-white rounded-lg px-3 py-2 shadow-sm';
      div.innerHTML = isSystem
        ? text
        : `<span class="font-medium text-blue-600">${name}:</span> <span>${text}</span>`;
      document.getElementById('messages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    socket.emit('join-room', {
      roomId,
      isCreator,
      name: creatorName
    });

    socket.on('joined', async (data) => {
      myName = data.name;
      expireAt = data.expireAt;
      document.getElementById('myName').textContent = myName;
      if (isCreator) {
        document.getElementById('dissolveBtn').classList.remove('hidden');
      }
      updateCountdown();
    });

    socket.on('history', async (messages) => {
      for (const msg of messages) {
        const text = await decrypt(msg.ciphertext);
        addMessage(msg.name, text);
      }
    });

    socket.on('message', async (msg) => {
      const text = await decrypt(msg.ciphertext);
      addMessage(msg.name, text);
    });

    socket.on('system', (text) => {
      addMessage('', text, true);
    });

    socket.on('error', (msg) => {
      alert(msg);
    });

    document.getElementById('msgForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      const ciphertext = await encrypt(text);
      socket.emit('message', { roomId, ciphertext });
      input.value = '';
    });

    document.getElementById('dissolveBtn').addEventListener('click', () => {
      if (confirm('Dissolve this room for everyone?')) {
        socket.emit('dissolve', { roomId });
      }
    });
  </script>
</body>
</html>
